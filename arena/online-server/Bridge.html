<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"></head>
<body style="margin:0;background:transparent;color:transparent">
<script>
(function(){
  'use strict';
  const origin=<?!= JSON.stringify(allowedOrigin) ?>;
  const marker='CM_ARENA_BRIDGE_V1';
  function send(id,ok,result,error){window.parent.postMessage({marker,id,ok,result,error},origin)}
  window.addEventListener('message',function(event){
    if(event.origin!==origin||!event.data||event.data.marker!==marker||event.data.op!=='request')return;
    const id=String(event.data.id||'');
    if(!/^[a-zA-Z0-9-]{12,80}$/.test(id))return;
    const payload=event.data.payload;
    if(!payload||typeof payload.action!=='string')return;
    google.script.run.withSuccessHandler(function(result){send(id,true,result,null)})
      .withFailureHandler(function(e){send(id,false,null,String(e&&e.message||e))}).cmAPI(payload);
  });
  window.parent.postMessage({marker,op:'ready'},origin);
  setInterval(function(){window.parent.postMessage({marker,op:'ready'},origin)},2500);
})();
</script></body></html>
