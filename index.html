<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ClassMana • Painel das Casas V16</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #23314c;
      --cream: #fff8df;
      --gold: #ffbd2e;
      --blue: #2869d8;
      --cyan: #36c8ee;
      --purple: #7048e8;
      --red: #e84b43;
      --green: #27a96b;
      --card: #fffdf7;
      --shadow: rgba(35, 49, 76, 0.15);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      color: var(--ink);
      font-family: "Fredoka", "Trebuchet MS", Arial, sans-serif;
      background: linear-gradient(135deg, #bfeaff 0%, #e2f5ff 50%, #fff7cf 100%);
      min-height: 100vh;
      padding: 20px 15px 40px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    /* Cabeçalho */
    header {
      text-align: center;
      margin-bottom: 25px;
      background: var(--card);
      padding: 20px 25px;
      border-radius: 24px;
      box-shadow: 0 8px 24px var(--shadow);
      border: 3px solid #fff;
    }

    .title-group {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    h1 {
      font-family: "Baloo 2", sans-serif;
      font-size: 2.4rem;
      font-weight: 800;
      color: var(--ink);
      line-height: 1.1;
    }

    .badge {
      background: var(--gold);
      color: var(--ink);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.9rem;
      font-weight: 700;
      text-transform: uppercase;
    }

    .subtitle {
      color: #5a6b8c;
      font-size: 1rem;
      margin-top: 6px;
    }

    /* Controles Gerais */
    .controls {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-top: 15px;
      flex-wrap: wrap;
    }

    .btn {
      font-family: "Fredoka", sans-serif;
      font-size: 0.95rem;
      font-weight: 600;
      padding: 10px 18px;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.08);
    }

    .btn:active {
      transform: scale(0.96);
    }

    .btn-primary { background: var(--blue); color: #fff; }
    .btn-primary:hover { background: #1e56be; }

    .btn-gold { background: var(--gold); color: var(--ink); }
    .btn-gold:hover { background: #e5a720; }

    .btn-danger { background: #ffe3e1; color: var(--red); }
    .btn-danger:hover { background: #ffd0cd; }

    /* Pódio das Casas */
    .podium-container {
      background: var(--card);
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 25px;
      box-shadow: 0 6px 20px var(--shadow);
      text-align: center;
    }

    .podium-title {
      font-family: "Baloo 2", sans-serif;
      font-size: 1.4rem;
      color: var(--ink);
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .podium-list {
      display: flex;
      justify-content: center;
      align-items: flex-end;
      gap: 15px;
      flex-wrap: wrap;
    }

    .podium-place {
      flex: 1;
      min-width: 150px;
      max-width: 180px;
      background: #f0f6ff;
      border-radius: 16px;
      padding: 15px 10px;
      position: relative;
      border: 2px solid transparent;
    }

    .podium-place.rank-1 {
      border-color: var(--gold);
      background: #fffdf0;
      transform: translateY(-8px);
    }

    .rank-crown { font-size: 1.6rem; margin-bottom: 4px; }
    .rank-name { font-weight: 700; font-size: 1.1rem; color: var(--ink); }
    .rank-score { font-size: 0.95rem; color: var(--blue); font-weight: 600; }

    /* Grid de Cartões das Casas */
    .houses-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .house-card {
      background: var(--card);
      border-radius: 22px;
      padding: 22px 18px;
      box-shadow: 0 8px 24px var(--shadow);
      display: flex;
      flex-direction: column;
      align-items: center;
      border: 4px solid var(--house-color, var(--blue));
      transition: transform 0.25s ease;
    }

    .house-card:hover {
      transform: translateY(-5px);
    }

    .house-icon {
      font-size: 2.8rem;
      margin-bottom: 8px;
      background: var(--cream);
      width: 70px;
      height: 70px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid var(--house-color, var(--blue));
    }

    .house-name {
      font-family: "Baloo 2", sans-serif;
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--ink);
      text-align: center;
    }

    .score-display {
      font-family: "Baloo 2", sans-serif;
      font-size: 2.5rem;
      font-weight: 800;
      color: var(--house-color, var(--blue));
      margin: 10px 0 15px;
    }

    .progress-bar-bg {
      width: 100%;
      height: 12px;
      background: #e2e8f0;
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 18px;
    }

    .progress-bar-fill {
      height: 100%;
      background: var(--house-color, var(--blue));
      width: 0%;
      transition: width 0.4s ease;
      border-radius: 10px;
    }

    .btn-group {
      display: flex;
      gap: 6px;
      width: 100%;
      justify-content: center;
    }

    .btn-sm {
      flex: 1;
      padding: 8px 0;
      font-size: 0.85rem;
      font-weight: 700;
      border-radius: 10px;
      border: none;
      cursor: pointer;
    }

    .btn-add { background: #e6f7ed; color: var(--green); }
    .btn-add:hover { background: #c3f0d4; }

    .btn-sub { background: #ffebeb; color: var(--red); }
    .btn-sub:hover { background: #ffd1d1; }

    /* Histórico */
    .history-card {
      background: var(--card);
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 6px 20px var(--shadow);
    }

    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .history-title {
      font-family: "Baloo 2", sans-serif;
      font-size: 1.2rem;
    }

    .history-list {
      list-style: none;
      max-height: 180px;
      overflow-y: auto;
    }

    .history-item {
      padding: 8px 12px;
      border-bottom: 1px solid #f0f0f0;
      font-size: 0.9rem;
      display: flex;
      justify-content: space-between;
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(35, 49, 76, 0.5);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
      z-index: 100;
      padding: 15px;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-content {
      background: var(--card);
      border-radius: 24px;
      padding: 25px;
      width: 100%;
      max-width: 420px;
    }

    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 0.9rem; font-weight: 600; margin-bottom: 5px; }
    .form-control {
      width: 100%;
      padding: 10px 14px;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      font-size: 0.95rem;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="title-group">
        <h1>ClassMana</h1>
        <span class="badge">Painel V16</span>
      </div>
      <p class="subtitle">Placar e Ranking Oficial das Casas / Personagens</p>

      <div class="controls">
        <button class="btn btn-primary" onclick="openCustomModal()">
          <span>⚡</span> Ajustar Pontos
        </button>
        <button class="btn btn-gold" onclick="restoreDefaultScores()">
          <span>📊</span> Recarregar Dados da Planilha
        </button>
      </div>
    </header>

    <section class="podium-container">
      <div class="podium-title">
        <span>🏆</span> Pódio Atual do ClassMana
      </div>
      <div class="podium-list" id="podiumList"></div>
    </section>

    <main class="houses-grid" id="housesGrid"></main>

    <section class="history-card">
      <div class="history-header">
        <h2 class="history-title">📜 Histórico de Lançamentos</h2>
        <button class="btn btn-danger" style="padding: 4px 10px; font-size: 0.8rem;" onclick="clearHistory()">Limpar</button>
      </div>
      <ul class="history-list" id="historyList"></ul>
    </section>
  </div>

  <div class="modal-overlay" id="customModal">
    <div class="modal-content">
      <h3 class="modal-title" style="font-family: 'Baloo 2'; font-size: 1.5rem; margin-bottom: 15px;">Lançar Pontuação</h3>
      <div class="form-group">
        <label for="houseSelect">Selecione a Casa / Personagem:</label>
        <select id="houseSelect" class="form-control"></select>
      </div>
      <div class="form-group">
        <label for="pointAmount">Pontos (+ ou -):</label>
        <input type="number" id="pointAmount" class="form-control" value="100">
      </div>
      <div class="form-group">
        <label for="pointReason">Descrição / Motivo:</label>
        <input type="text" id="pointReason" class="form-control" placeholder="Ex: Desafio de Matemática Concluído">
      </div>
      <div class="modal-actions">
        <button class="btn btn-danger" onclick="closeCustomModal()">Cancelar</button>
        <button class="btn btn-primary" onclick="submitCustomPoints()">Confirmar</button>
      </div>
    </div>
  </div>

  <script>
    // CASAS E PERSONAGENS REAIS DO CLASSMANA
    const OFFICIAL_CLASSMANA_HOUSES = [
      { id: 'lobo', name: 'Lobo Gatuno', icon: '🐺', color: '#7048e8', score: 145404 },
      { id: 'fada', name: 'Fada Guerreira', icon: '🧚‍♀️', color: '#36c8ee', score: 125815 },
      { id: 'maga', name: 'Maga Engenheira', icon: '⚙️', color: '#27a96b', score: 87551 },
      { id: 'dragao', name: 'Dragão de Combate', icon: '🐉', color: '#e84b43', score: 79599 },
      { id: 'cavaleiro', name: 'Cavaleiro Guardião', icon: '🛡️', color: '#2869d8', score: 76125 },
      { id: 'chama', name: 'Chama Congelante', icon: '❄️', color: '#ffbd2e', score: 50592 },
      { id: 'aguia', name: 'Águia Dourada', icon: '🦅', color: '#e5a720', score: 200 }
    ];

    let houses = JSON.parse(localStorage.getItem('classmana_houses_v16')) || OFFICIAL_CLASSMANA_HOUSES;
    let historyLogs = JSON.parse(localStorage.getItem('classmana_history_v16')) || [];

    function saveData() {
      localStorage.setItem('classmana_houses_v16', JSON.stringify(houses));
      localStorage.setItem('classmana_history_v16', JSON.stringify(historyLogs));
    }

    function changeScore(houseId, delta, reason = '') {
      const house = houses.find(h => h.id === houseId);
      if (!house) return;

      house.score += delta;
      
      const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      const sign = delta > 0 ? '+' : '';
      const reasonText = reason ? ` (${reason})` : '';
      
      historyLogs.unshift({
        text: `${sign}${delta.toLocaleString('pt-BR')} pts para ${house.name}${reasonText}`,
        time: timeStr
      });

      if (historyLogs.length > 30) historyLogs.pop();

      saveData();
      renderApp();
    }

    function renderPodium() {
      const sorted = [...houses].sort((a, b) => b.score - a.score);
      const podiumEl = document.getElementById('podiumList');
      podiumEl.innerHTML = '';

      sorted.slice(0, 3).forEach((house, index) => {
        const placeEl = document.createElement('div');
        placeEl.className = `podium-place ${index === 0 ? 'rank-1' : ''}`;
        placeEl.innerHTML = `
          <div class="rank-crown">${index === 0 ? '🏆' : (index === 1 ? '🥈' : '🥉')}</div>
          <div class="rank-name">${house.icon} ${house.name}</div>
          <div class="rank-score">${house.score.toLocaleString('pt-BR')} pts</div>
        `;
        podiumEl.appendChild(placeEl);
      });
    }

    function renderHouses() {
      const gridEl = document.getElementById('housesGrid');
      gridEl.innerHTML = '';

      const maxScore = Math.max(...houses.map(h => h.score), 100);

      houses.forEach(house => {
        const progressPercent = Math.min(Math.max((house.score / maxScore) * 100, 2), 100);

        const card = document.createElement('article');
        card.className = 'house-card';
        card.style.setProperty('--house-color', house.color);

        card.innerHTML = `
          <div class="house-icon">${house.icon}</div>
          <h2 class="house-name">${house.name}</h2>
          <div class="score-display">${house.score.toLocaleString('pt-BR')}</div>
          <div class="progress-bar-bg">
            <div class="progress-bar-fill" style="width: ${progressPercent}%"></div>
          </div>
          <div class="btn-group">
            <button class="btn-sm btn-add" onclick="changeScore('${house.id}', 100)">+100</button>
            <button class="btn-sm btn-add" onclick="changeScore('${house.id}', 500)">+500</button>
            <button class="btn-sm btn-add" onclick="changeScore('${house.id}', 1000)">+1k</button>
            <button class="btn-sm btn-sub" onclick="changeScore('${house.id}', -100)">-100</button>
          </div>
        `;
        gridEl.appendChild(card);
      });
    }

    function renderHistory() {
      const historyEl = document.getElementById('historyList');
      historyEl.innerHTML = '';

      if (historyLogs.length === 0) {
        historyEl.innerHTML = '<li class="history-item" style="color:#8a99b5">Nenhum lançamento registrado.</li>';
        return;
      }

      historyLogs.forEach(log => {
        const li = document.createElement('li');
        li.className = 'history-item';
        li.innerHTML = `
          <span>${log.text}</span>
          <span style="font-size:0.8rem; color:#8a99b5;">${log.time}</span>
        `;
        historyEl.appendChild(li);
      });
    }

    function clearHistory() {
      historyLogs = [];
      saveData();
      renderHistory();
    }

    function restoreDefaultScores() {
      if (confirm("Deseja recarregar as pontuações oficiais sincronizadas com a planilha?")) {
        houses = JSON.parse(JSON.stringify(OFFICIAL_CLASSMANA_HOUSES));
        historyLogs.unshift({
          text: `Dados recarregados da planilha oficial`,
          time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        });
        saveData();
        renderApp();
      }
    }

    function openCustomModal() {
      const selectEl = document.getElementById('houseSelect');
      selectEl.innerHTML = '';
      houses.forEach(h => {
        const opt = document.createElement('option');
        opt.value = h.id;
        opt.textContent = `${h.icon} ${h.name}`;
        selectEl.appendChild(opt);
      });

      document.getElementById('customModal').classList.add('active');
    }

    function closeCustomModal() {
      document.getElementById('customModal').classList.remove('active');
    }

    function submitCustomPoints() {
      const houseId = document.getElementById('houseSelect').value;
      const amount = parseInt(document.getElementById('pointAmount').value, 10);
      const reason = document.getElementById('pointReason').value.trim();

      if (isNaN(amount) || amount === 0) {
        alert("Insira uma quantidade válida.");
        return;
      }

      changeScore(houseId, amount, reason);
      closeCustomModal();
      document.getElementById('pointReason').value = '';
    }

    function renderApp() {
      renderPodium();
      renderHouses();
      renderHistory();
    }

    renderApp();
  </script>
</body>
</html>
