<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ClassMana • Painel das Casas V16</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #23314c;
      --cream: #fff8df;
      --gold: #ffbd2e;
      --blue: #2869d8;
      --cyan: #36c8ee;
      --purple: #7048e8;
      --red: #e84b43;
      --green: #27a96b;
      --card: #fffdf7;
      --shadow: rgba(35, 49, 76, 0.15);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      color: var(--ink);
      font-family: "Fredoka", "Trebuchet MS", Arial, sans-serif;
      background: linear-gradient(135deg, #bfeaff 0%, #e2f5ff 50%, #fff7cf 100%);
      min-height: 100vh;
      padding: 20px 15px 40px;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
    }

    /* Cabeçalho */
    header {
      text-align: center;
      margin-bottom: 25px;
      background: var(--card);
      padding: 20px 25px;
      border-radius: 24px;
      box-shadow: 0 8px 24px var(--shadow);
      border: 3px solid #fff;
    }

    .title-group {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    h1 {
      font-family: "Baloo 2", sans-serif;
      font-size: 2.4rem;
      font-weight: 800;
      color: var(--ink);
      line-height: 1.1;
    }

    .badge {
      background: var(--gold);
      color: var(--ink);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.9rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .subtitle {
      color: #5a6b8c;
      font-size: 1rem;
      margin-top: 6px;
    }

    /* Barra de Ações Gerais */
    .controls {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-top: 15px;
      flex-wrap: wrap;
    }

    .btn {
      font-family: "Fredoka", sans-serif;
      font-size: 0.95rem;
      font-weight: 600;
      padding: 10px 18px;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.08);
    }

    .btn:active {
      transform: scale(0.96);
    }

    .btn-primary {
      background: var(--blue);
      color: #fff;
    }
    .btn-primary:hover {
      background: #1e56be;
    }

    .btn-gold {
      background: var(--gold);
      color: var(--ink);
    }
    .btn-gold:hover {
      background: #e5a720;
    }

    .btn-danger {
      background: #ffe3e1;
      color: var(--red);
    }
    .btn-danger:hover {
      background: #ffd0cd;
    }

    /* Pódio das Casas */
    .podium-container {
      background: var(--card);
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 25px;
      box-shadow: 0 6px 20px var(--shadow);
      text-align: center;
    }

    .podium-title {
      font-family: "Baloo 2", sans-serif;
      font-size: 1.3rem;
      color: var(--ink);
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .podium-list {
      display: flex;
      justify-content: center;
      align-items: flex-end;
      gap: 15px;
    }

    .podium-place {
      flex: 1;
      max-width: 180px;
      background: #f0f6ff;
      border-radius: 16px;
      padding: 15px 10px;
      transition: all 0.3s ease;
      position: relative;
      border: 2px solid transparent;
    }

    .podium-place.rank-1 {
      border-color: var(--gold);
      background: #fffdf0;
      transform: translateY(-8px);
    }

    .rank-crown {
      font-size: 1.6rem;
      margin-bottom: 4px;
    }

    .rank-name {
      font-weight: 700;
      font-size: 1.1rem;
      color: var(--ink);
      margin-bottom: 2px;
    }

    .rank-score {
      font-size: 0.95rem;
      color: var(--blue);
      font-weight: 600;
    }

    /* Grid de Cartões das Casas */
    .houses-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .house-card {
      background: var(--card);
      border-radius: 22px;
      padding: 22px 18px;
      box-shadow: 0 8px 24px var(--shadow);
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      border: 4px solid var(--house-color, var(--blue));
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .house-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 12px 30px var(--shadow);
    }

    .house-icon {
      font-size: 2.8rem;
      margin-bottom: 8px;
      background: var(--cream);
      width: 70px;
      height: 70px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid var(--house-color, var(--blue));
    }

    .house-name {
      font-family: "Baloo 2", sans-serif;
      font-size: 1.6rem;
      font-weight: 800;
      color: var(--ink);
      margin-bottom: 6px;
      text-align: center;
    }

    .score-display {
      font-family: "Baloo 2", sans-serif;
      font-size: 2.8rem;
      font-weight: 800;
      color: var(--house-color, var(--blue));
      line-height: 1;
      margin: 10px 0 15px;
    }

    /* Barra de Progresso Interna */
    .progress-bar-bg {
      width: 100%;
      height: 12px;
      background: #e2e8f0;
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 18px;
    }

    .progress-bar-fill {
      height: 100%;
      background: var(--house-color, var(--blue));
      width: 0%;
      transition: width 0.4s ease;
      border-radius: 10px;
    }

    /* Botões Rápidos */
    .btn-group {
      display: flex;
      gap: 6px;
      width: 100%;
      justify-content: center;
    }

    .btn-sm {
      flex: 1;
      padding: 8px 0;
      font-size: 0.9rem;
      font-weight: 700;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      transition: background 0.2s ease;
      text-align: center;
    }

    .btn-add {
      background: #e6f7ed;
      color: var(--green);
    }
    .btn-add:hover {
      background: #c3f0d4;
    }

    .btn-sub {
      background: #ffebeb;
      color: var(--red);
    }
    .btn-sub:hover {
      background: #ffd1d1;
    }

    /* Histórico */
    .history-card {
      background: var(--card);
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 6px 20px var(--shadow);
    }

    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .history-title {
      font-family: "Baloo 2", sans-serif;
      font-size: 1.2rem;
      color: var(--ink);
    }

    .history-list {
      list-style: none;
      max-height: 180px;
      overflow-y: auto;
      padding-right: 5px;
    }

    .history-item {
      padding: 8px 12px;
      border-bottom: 1px solid #f0f0f0;
      font-size: 0.9rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .history-item:last-child {
      border-bottom: none;
    }

    .history-time {
      font-size: 0.78rem;
      color: #8a99b5;
    }

    /* Modal Ajuste Personalizado */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(35, 49, 76, 0.5);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
      z-index: 100;
      padding: 15px;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-content {
      background: var(--card);
      border-radius: 24px;
      padding: 25px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.2);
      transform: translateY(20px);
      transition: transform 0.25s ease;
    }

    .modal-overlay.active .modal-content {
      transform: translateY(0);
    }

    .modal-title {
      font-family: "Baloo 2", sans-serif;
      font-size: 1.5rem;
      margin-bottom: 15px;
      color: var(--ink);
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 5px;
      color: var(--ink);
    }

    .form-control {
      width: 100%;
      padding: 10px 14px;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      font-family: inherit;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-control:focus {
      border-color: var(--blue);
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      margin-top: 20px;
    }

    /* Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 10px;
    }

    @media (max-width: 600px) {
      h1 { font-size: 1.8rem; }
      .score-display { font-size: 2.3rem; }
      .podium-list { flex-direction: column; align-items: stretch; }
      .podium-place { max-width: 100%; }
      .podium-place.rank-1 { transform: none; }
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Cabeçalho Principal -->
    <header>
      <div class="title-group">
        <h1>ClassMana</h1>
        <span class="badge">Painel V16</span>
      </div>
      <p class="subtitle">Gerenciador e Placar de Pontos das Casas</p>

      <div class="controls">
        <button class="btn btn-primary" onclick="openCustomModal()">
          <span>⚡</span> Ajustar Pontos
        </button>
        <button class="btn btn-gold" onclick="resetScores()">
          <span>🔄</span> Zerar Placares
        </button>
      </div>
    </header>

    <!-- Seção do Pódio -->
    <section class="podium-container">
      <div class="podium-title">
        <span>🏆</span> Pódio Atual das Casas
      </div>
      <div class="podium-list" id="podiumList">
        <!-- Preenchido via JavaScript -->
      </div>
    </section>

    <!-- Grid das Casas -->
    <main class="houses-grid" id="housesGrid">
      <!-- Preenchido via JavaScript -->
    </main>

    <!-- Histórico de Lançamentos -->
    <section class="history-card">
      <div class="history-header">
        <h2 class="history-title">📜 Histórico de Lançamentos</h2>
        <button class="btn btn-danger" style="padding: 4px 10px; font-size: 0.8rem;" onclick="clearHistory()">Limpar Histórico</button>
      </div>
      <ul class="history-list" id="historyList">
        <li class="history-item">Nenhum lançamento registrado ainda.</li>
      </ul>
    </section>
  </div>

  <!-- Modal de Lançamento Personalizado -->
  <div class="modal-overlay" id="customModal">
    <div class="modal-content">
      <h3 class="modal-title">Lançar Pontuação</h3>
      <div class="form-group">
        <label for="houseSelect">Selecione a Casa:</label>
        <select id="houseSelect" class="form-control"></select>
      </div>
      <div class="form-group">
        <label for="pointAmount">Quantidade de Pontos (+ ou -):</label>
        <input type="number" id="pointAmount" class="form-control" value="10" placeholder="Ex: 10 ou -5">
      </div>
      <div class="form-group">
        <label for="pointReason">Motivo / Descrição:</label>
        <input type="text" id="pointReason" class="form-control" placeholder="Ex: Tarefa em equipe concluída">
      </div>
      <div class="modal-actions">
        <button class="btn btn-danger" onclick="closeCustomModal()">Cancelar</button>
        <button class="btn btn-primary" onclick="submitCustomPoints()">Confirmar</button>
      </div>
    </div>
  </div>

  <script>
    // Estrutura inicial padrão
    const DEFAULT_HOUSES = [
      { id: 'fogo', name: 'Fogo', icon: '🔥', color: '#e84b43', score: 0 },
      { id: 'agua', name: 'Água', icon: '💧', color: '#2869d8', score: 0 },
      { id: 'terra', name: 'Terra', icon: '🌿', color: '#27a96b', score: 0 },
      { id: 'ar', name: 'Ar', icon: '⚡', color: '#ffbd2e', score: 0 }
    ];

    let houses = JSON.parse(localStorage.getItem('classmana_houses')) || DEFAULT_HOUSES;
    let historyLogs = JSON.parse(localStorage.getItem('classmana_history')) || [];

    // Salvar estado no navegador
    function saveData() {
      localStorage.setItem('classmana_houses', JSON.stringify(houses));
      localStorage.setItem('classmana_history', JSON.stringify(historyLogs));
    }

    // Alteração de Pontos
    function changeScore(houseId, delta, reason = '') {
      const house = houses.find(h => h.id === houseId);
      if (!house) return;

      house.score += delta;
      
      const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      const sign = delta > 0 ? '+' : '';
      const reasonText = reason ? ` (${reason})` : '';
      
      historyLogs.unshift({
        text: `${sign}${delta} pts para a Casa ${house.name}${reasonText}`,
        time: timeStr
      });

      if (historyLogs.length > 25) historyLogs.pop();

      saveData();
      renderApp();
    }

    // Renderizar Pódio
    function renderPodium() {
      const sorted = [...houses].sort((a, b) => b.score - a.score);
      const podiumEl = document.getElementById('podiumList');
      podiumEl.innerHTML = '';

      sorted.forEach((house, index) => {
        const placeEl = document.createElement('div');
        placeEl.className = `podium-place ${index === 0 ? 'rank-1' : ''}`;
        placeEl.innerHTML = `
          <div class="rank-crown">${index === 0 ? '🏆' : (index === 1 ? '🥈' : '🥉')}</div>
          <div class="rank-name">${house.icon} ${house.name}</div>
          <div class="rank-score">${house.score} pts</div>
        `;
        podiumEl.appendChild(placeEl);
      });
    }

    // Renderizar Grid das Casas
    function renderHouses() {
      const gridEl = document.getElementById('housesGrid');
      gridEl.innerHTML = '';

      const maxScore = Math.max(...houses.map(h => h.score), 10);

      houses.forEach(house => {
        const progressPercent = Math.min(Math.max((house.score / maxScore) * 100, 0), 100);

        const card = document.createElement('article');
        card.className = 'house-card';
        card.style.setProperty('--house-color', house.color);

        card.innerHTML = `
          <div class="house-icon">${house.icon}</div>
          <h2 class="house-name">${house.name}</h2>
          <div class="score-display">${house.score}</div>
          <div class="progress-bar-bg">
            <div class="progress-bar-fill" style="width: ${progressPercent}%"></div>
          </div>
          <div class="btn-group">
            <button class="btn-sm btn-add" onclick="changeScore('${house.id}', 1)">+1</button>
            <button class="btn-sm btn-add" onclick="changeScore('${house.id}', 5)">+5</button>
            <button class="btn-sm btn-add" onclick="changeScore('${house.id}', 10)">+10</button>
            <button class="btn-sm btn-sub" onclick="changeScore('${house.id}', -1)">-1</button>
            <button class="btn-sm btn-sub" onclick="changeScore('${house.id}', -5)">-5</button>
          </div>
        `;
        gridEl.appendChild(card);
      });
    }

    // Renderizar Histórico
    function renderHistory() {
      const historyEl = document.getElementById('historyList');
      historyEl.innerHTML = '';

      if (historyLogs.length === 0) {
        historyEl.innerHTML = '<li class="history-item" style="color:#8a99b5">Nenhum lançamento registrado.</li>';
        return;
      }

      historyLogs.forEach(log => {
        const li = document.createElement('li');
        li.className = 'history-item';
        li.innerHTML = `
          <span>${log.text}</span>
          <span class="history-time">${log.time}</span>
        `;
        historyEl.appendChild(li);
      });
    }

    function clearHistory() {
      historyLogs = [];
      saveData();
      renderHistory();
    }

    function resetScores() {
      if (confirm("Tem certeza que deseja zerar a pontuação de todas as casas?")) {
        houses.forEach(h => h.score = 0);
        historyLogs.unshift({
          text: `Placares zerados pelo usuário`,
          time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        });
        saveData();
        renderApp();
      }
    }

    function openCustomModal() {
      const selectEl = document.getElementById('houseSelect');
      selectEl.innerHTML = '';
      houses.forEach(h => {
        const opt = document.createElement('option');
        opt.value = h.id;
        opt.textContent = `${h.icon} ${h.name}`;
        selectEl.appendChild(opt);
      });

      document.getElementById('customModal').classList.add('active');
    }

    function closeCustomModal() {
      document.getElementById('customModal').classList.remove('active');
    }

    function submitCustomPoints() {
      const houseId = document.getElementById('houseSelect').value;
      const amount = parseInt(document.getElementById('pointAmount').value, 10);
      const reason = document.getElementById('pointReason').value.trim();

      if (isNaN(amount) || amount === 0) {
        alert("Insira uma quantidade válida de pontos.");
        return;
      }

      changeScore(houseId, amount, reason);
      closeCustomModal();
      document.getElementById('pointReason').value = '';
    }

    function renderApp() {
      renderPodium();
      renderHouses();
      renderHistory();
    }

    renderApp();
  </script>
</body>
</html>
